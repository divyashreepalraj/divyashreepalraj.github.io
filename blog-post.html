<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article Detail | Divya Shree P - Technical Writing</title>
  <meta name="description" content="Technical article and engineering insights by Divya Shree P.">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    (function() {
      const savedTheme = localStorage.getItem('divya_portfolio_theme');
      const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', savedTheme || (systemDark ? 'dark' : 'dark'));
    })();
  </script>
</head>
<body>
  <!-- Scroll Progress Bar -->
  <div class="scroll-progress-container">
    <div class="scroll-progress-bar"></div>
  </div>

  <!-- Dynamic Shared Header -->
  <div id="site-header"></div>

  <main id="main-content" style="padding-top: 140px; min-height: 80vh;" class="container">
    <div class="blog-post-container">
      <!-- Dynamically Rendered by blog.js renderBlogPostDetail() -->
    </div>
  </main>

  <!-- Dynamic Shared Footer -->
  <div id="site-footer"></div>

  <!-- Back to Top Button -->
  <button class="back-to-top btn-icon" aria-label="Back to top">
    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"/></svg>
  </button>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
