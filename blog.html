<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog & Technical Articles | Divya Shree P - UI Engineer</title>
  <meta name="description" content="Technical articles on design systems, CSS BEM architecture, UI engineering, web performance, and accessibility by Divya Shree P.">
  <link rel="canonical" href="https://divyashree.dev/blog.html">
  <link rel="stylesheet" href="assets/css/style.css">
  
  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Blog & Technical Articles | Divya Shree P">
  <meta property="og:description" content="Articles on modular CSS architecture, performance engineering, WCAG accessibility, and evolving from UI design to full frontend engineering.">
  <meta property="og:url" content="https://divyashree.dev/blog.html">

  <script>
    (function() {
      const savedTheme = localStorage.getItem('divya_portfolio_theme');
      const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', savedTheme || (systemDark ? 'dark' : 'dark'));
    })();
  </script>
</head>
<body>
  <!-- Scroll Progress Bar -->
  <div class="scroll-progress-container">
    <div class="scroll-progress-bar"></div>
  </div>

  <!-- Dynamic Shared Header -->
  <div id="site-header"></div>

  <main id="main-content" style="padding-top: 140px; min-height: 80vh;" class="container">
    <div class="section-header reveal-up">
      <span class="section-tag">Technical Writing</span>
      <h1 class="section-title">Articles & Insights</h1>
      <p class="section-description text-secondary">
        Articles on modular CSS architecture, performance engineering, WCAG accessibility, and evolving from UI design to full engineering.
      </p>

      <div class="flex gap-2" style="margin-top: 1.5rem; flex-wrap: wrap;">
        <button class="skill-tab-btn active" data-blog-filter="all">All Topics</button>
        <button class="skill-tab-btn" data-blog-filter="engineering">Engineering</button>
        <button class="skill-tab-btn" data-blog-filter="career">Career & Growth</button>
        <button class="skill-tab-btn" data-blog-filter="performance">Performance</button>
        <button class="skill-tab-btn" data-blog-filter="accessibility">Accessibility</button>
      </div>

      <div style="margin-top: 1.5rem; max-width: 450px;">
        <input type="text" id="blog-search-input" class="form-input" placeholder="Search by title, tag (#BEM, #CSS3)..." aria-label="Search articles">
      </div>
    </div>

    <div class="blog-listing-container reveal-up" style="margin-bottom: 4rem;">
      <!-- Dynamically Rendered by blog.js -->
    </div>
  </main>

  <!-- Dynamic Shared Footer -->
  <div id="site-footer"></div>

  <!-- Back to Top Button -->
  <button class="back-to-top btn-icon" aria-label="Back to top">
    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"/></svg>
  </button>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
